<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Island UI — Vanilla</title>
  <link rel="stylesheet" href="css/animal-island.css?v=3">
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:0;font-family:Nunito,'Noto Sans SC',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#794f27;background:#f8f8f0}
    #app{height:100dvh;overflow:hidden}
    /* Component page layout */
    .app-layout{display:flex;height:100dvh;overflow:hidden;background:url('assets/img/demo/content_bg_pc.jpg') center/auto repeat}
    .sidebar{width:220px;min-width:220px;background:url('assets/img/demo/menu_bg.svg') center/cover no-repeat;display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:20px 16px 12px;border-bottom:1px solid #e8e2d6;font-weight:700;font-size:15px;color:#725d42;letter-spacing:-0.3px;display:flex;align-items:center;cursor:pointer;transition:background .15s}
    .sidebar-header:hover{background:rgba(255,255,255,.3)}
    .sidebar-header img{width:24px;height:24px;margin-right:8px}
    .sidebar-menu{flex:1;overflow:auto;padding:8px 0}
    .sidebar-category{padding:12px 16px 4px;font-size:11px;color:#a0936e;font-weight:600;letter-spacing:.5px}
    .sidebar-item{display:flex;align-items:center;margin:1px 5px;height:40px;padding:0 16px 0 26px;font-weight:600;font-size:14px;color:#8a7b66;background:transparent;border-radius:12px;border:none;cursor:pointer;transition:all .15s;width:calc(100% - 10px);text-align:left;font-family:inherit}
    .sidebar-item:hover{background:#d6dff0}
    .sidebar-item--active{background:#B7C6E5!important;color:#fff!important}
    .main-content{flex:1;overflow:auto;padding:32px 40px;position:relative;z-index:1}
    .guide-line{position:fixed;left:220px;right:0;bottom:0;width:calc(100% - 220px);pointer-events:none;z-index:0}
    /* Home page layout */
    .home-page{width:100%;flex:1;overflow-y:auto;overflow-x:hidden;background:url('assets/img/demo/home_bg.webp') 0 0/auto repeat,#7DC395;animation:bgScroll 80s linear infinite}
    .home-layout{display:flex;height:100dvh;background:url('assets/img/demo/home_bg.webp') 0 0/auto repeat,#7DC395;animation:bgScroll 80s linear infinite;justify-content:center}
    @keyframes bgScroll{0%{background-position:100% 0%}100%{background-position:0% 100%}}
    .home-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 40px 40px;position:relative}
    .home-hero-content{display:grid;grid-template-columns:1fr 1fr;gap:150px;align-items:center;max-width:880px;width:100%}
    .home-hero-text{text-align:left}
    .home-hero-title{font-size:60px;font-weight:800;line-height:1.1;color:#FFF9E6;text-shadow:0 4px 1px rgba(0,0,0,.4);margin:0 0 12px}
    .home-hero-version{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;background:#e6f9f6;color:#19c8b9;margin-left:8px;vertical-align:middle;text-shadow:none}
    .home-hero-subtitle{font-size:17px;color:#7c5734;line-height:1.7;margin:0 0 28px;max-width:520px}
    .home-hero-logo{text-align:center}
    .home-hero-logo img{width:320px;height:200px}
    .home-scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;animation:bounce 2s ease-in-out infinite;transition:opacity .3s ease}
    .home-scroll-hint span{color:#FFF9E6;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
    @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}50%{transform:translateX(-50%) translateY(-8px);opacity:.7}}
    .home-section{padding:48px 40px;max-width:960px;margin:0 auto}
    .home-section-title{font-size:24px;font-weight:700;color:#725d42;margin:0 0 8px;text-align:center}
    .home-section-desc{font-size:14px;color:#7c5734;text-align:center;margin-bottom:32px}
    .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .feature-card{padding:24px 20px;text-align:center;transition:all .3s ease;cursor:default}
    .feature-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(114,93,66,.15)}
    .feature-card img{width:42px;height:42px;transition:transform .3s ease}
    .feature-card:hover img{transform:scale(1.1) rotate(-4deg)}
    .feature-card-title{font-size:15px;font-weight:700;color:#725d42;margin:12px 0 6px}
    .feature-card-desc{font-size:13px;color:#7c5734;line-height:1.6}
    .comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
    .comp-card{padding:16px 20px;cursor:pointer;transition:all .2s}
    .comp-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(114,93,66,.1)}
    .comp-name{font-size:15px;font-weight:700;color:#725d42;margin-bottom:4px}
    .comp-desc{font-size:12px;color:#7c5734;line-height:1.5}
    .home-code-box{max-width:600px;margin:0 auto;padding:20px 28px;background:#2b2118;border:1px solid #3d3028;border-radius:20px;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:13px;font-weight:600;color:#e8d5bc;text-align:left;line-height:1.8;white-space:pre;overflow:auto;tab-size:4}
    .home-footer{padding:32px 40px;text-align:center;font-size:12px;color:#7c5734;margin-top:32px}
    .home-footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:12px}
    .home-footer-link{font-size:13px;color:#7c5734;cursor:pointer;transition:color .15s}
    .home-footer-link:hover{color:#19c8b9}
    .comp-page-title{font-size:24px;font-weight:700;color:#794f27;margin-bottom:12px;line-height:1.4}
    .comp-page-desc{font-size:14px;color:#794f27;margin-bottom:20px;min-height:40px}
    .demo-section{margin-bottom:36px;padding:24px;background:#fff;border-radius:12px;border:1px solid #e8e2d6}
    .demo-section-title{font-size:18px;font-weight:600;color:#725d42;display:flex;align-items:center;gap:8px;margin-bottom:16px}
    .demo-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:#f0e8d8;color:#a08060;font-weight:500}
    .demo-label{font-size:14px;color:#a0936e;margin:20px 0 12px;font-weight:500}
    .demo-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .demo-col{display:flex;flex-direction:column;gap:12px}
    .demo-box{margin-top:12px;padding:16px;background:#faf8f3;border-radius:12px;border:1px solid #e8e2d6}
    .demo-dashed-box{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px;background:rgb(250,248,242);border:1px dashed rgb(224,216,200);border-radius:18px}
    .api-label{font-size:14px;font-weight:600;color:#e7e4e0;margin-bottom:0;padding:6px 12px;background:#3d3028;border-radius:10px 10px 0 0;display:inline-block}
    .api-table-wrap{margin-top:24px}
    .api-table{width:100%;border-collapse:collapse;font-size:13px;background:#2b2118;border-radius:0 20px 20px 20px;overflow:hidden}
    .api-table th{padding:10px 16px;text-align:left;font-weight:600;color:#e8d5bc;background:#3d3028}
    .api-table td{padding:10px 16px;color:#c8bba8;border-top:1px solid #3d3028}
    .api-table .prop-name{color:#e8c87a}
    .api-table .prop-required{color:#f0a870;margin-left:4px}
    .api-table .prop-type{color:#d4a0e0}
    .api-table .prop-default{color:#a8d4a0}
    .code-label{font-size:14px;font-weight:600;color:#e7e4e0;margin-bottom:0;padding:6px 12px;background:#3d3028;border-radius:10px 10px 0 0;display:inline-block;margin-top:36px}
    .card-color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .card-color-item{padding:16px;text-align:center;font-size:13px;font-weight:600}
    .icon-list{border:1px solid #e8e2d6;border-radius:12px;overflow:hidden;padding:0 16px}
    .icon-list-item{display:flex;align-items:center;gap:20px;padding:12px 5px;border-bottom:1px dashed #f0e8d8}
    .icon-list-item:last-child{border-bottom:none}
    .icon-list-name{font-size:14px;color:#725d42}
    .icon-list-key{margin-left:auto;font-size:12px;color:#a0936e;font-family:'SF Mono','Fira Code',Consolas,monospace}
    .phone-demo-wrap{display:flex;justify-content:center;padding:40px 0;overflow-x:auto}
    .cursor-demo-area{padding:24px;background:#f0e8d8;border-radius:20px;text-align:center}
    .loading-demo-container{position:relative;width:100%;height:800px;padding:0;overflow:hidden;border-radius:12px}
    .loading-demo-bg{position:absolute;inset:0;background:linear-gradient(135deg,#ffd6a5 0%,#fdffb6 25%,#caffbf 50%,#9bf6ff 75%,#a0c4ff 100%);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#333}
    .footer-demo-area{margin-top:40px}
    @media(max-width:768px){
      .sidebar{display:none}.guide-line{display:none}
      .main-content{padding:16px;padding-top:68px}
      .home-hero-content{grid-template-columns:1fr;gap:32px}
      .home-hero-title{font-size:37px}
      .home-hero-text{text-align:center}
      .home-hero-logo img{width:180px;height:112px}
      .mobile-topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,252,244,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #e8e2d6;z-index:50}
      .mobile-topbar-btn{background:none;border:none;font-size:20px;color:#725d42;padding:4px 8px;border-radius:8px;cursor:pointer;line-height:1}
      .mobile-topbar-title{font-weight:700;font-size:15px;color:#725d42}
      .mobile-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:98}
      .mobile-drawer{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:99;box-shadow:4px 0 24px rgba(0,0,0,.15);background:url('assets/img/demo/menu_bg.svg') center/cover no-repeat;display:flex;flex-direction:column;overflow:hidden}
    }
    @media(min-width:769px){.mobile-topbar{display:none}.mobile-drawer-overlay{display:none}.mobile-drawer{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="js/animal-island.js?v=3"></script>
  <script src="js/demo-app.js?v=3"></script>
</body>
</html>
